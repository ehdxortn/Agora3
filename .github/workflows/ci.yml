name: CI

on:
  push:
    branches: [main, btc-research-engine]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pydantic==2.11.7 pandas==2.3.2 numpy==2.2.6 pytest==8.4.1
      - name: Compile
        run: python -m compileall -q .
      - name: Test
        run: pytest -q
